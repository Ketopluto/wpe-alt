name: Build Wallpaper Studio (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtmultimedia'

    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: build/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build project
      run: |
        cmake --build build --config Release

    - name: Run Tests
      working-directory: build
      run: |
        ctest -C Release --output-on-failure

    - name: Deploy Qt DLLs
      run: |
        # Use windeployqt to copy required Qt DLLs to the executable directory
        windeployqt --release --no-translations --no-compiler-runtime build\Release\WallpaperStudio.exe

    - name: Copy FFmpeg DLLs
      run: |
        # Copy FFmpeg DLLs from local vcpkg_installed to the build folder
        Copy-Item "build\vcpkg_installed\x64-windows\bin\*.dll" -Destination build\Release\

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WallpaperStudio-Windows
        path: build\Release\*
